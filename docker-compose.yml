# PINN BAI — stack para VPS (Nginx + SPA + API Node + Supabase na nuvem)
# Uso: copie deploy.env.example para .env na raiz e preencha; depois:
#   docker compose --env-file .env up -d --build
#
# Em produção (Traefik na VPS): serviços na rede externa `root_default`;
# o router expõe apenas o Nginx (SPA + /api via proxy interno).

services:
  api:
    build:
      context: ./server
      dockerfile: Dockerfile
    environment:
      PORT: "8787"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
    expose:
      - "8787"
    restart: unless-stopped
    networks:
      - root_default
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 15s

  # Backend Python (FastAPI) — CRM Auditor, Health, KPI, Email Outreach (Pinn Smart).
  # Roda na mesma rede do compose; o nginx do `web` proxa /email/, /crm/, /ads/,
  # /hub/, /kpi/, /webhook/, /adapters/, /track/ e /unsubscribe/ pra cá.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      PORT: "8000"
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_SERVICE_KEY: ${SUPABASE_SERVICE_KEY:-${SUPABASE_SERVICE_ROLE_KEY:-}}
      SUPABASE_ANON_KEY: ${SUPABASE_ANON_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Email Outreach (Pinn Smart)
      EO_ENCRYPTION_KEY: ${EO_ENCRYPTION_KEY:-}
      EO_HEALTHCHECK_INTERVAL_MINUTES: ${EO_HEALTHCHECK_INTERVAL_MINUTES:-60}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-}
      # CRM Auditor (Kommo token direto) + LLM
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # WhatsApp Outreach (proxy pro Mari Brain)
      MARI_API_BASE: ${MARI_API_BASE:-https://mari.pinnpb.com}
      MARI_API_TOKEN: ${MARI_API_TOKEN:-}
    expose:
      - "8000"
    restart: unless-stopped
    networks:
      - root_default
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=5).status==200 else 1)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY}
        # Deixe vazio para o browser usar /api no mesmo host (recomendado com este compose)
        VITE_API_URL: ${VITE_API_URL:-}
        # Supabase do projeto Mari (mesmo URL/key que o backend Mari usa — idealmente anon com RLS ou service role só em rede fechada)
        VITE_MARI_SUPABASE_URL: ${VITE_MARI_SUPABASE_URL:-}
        VITE_MARI_SUPABASE_KEY: ${VITE_MARI_SUPABASE_KEY:-}
        # Google Maps JS API (demo Arguto / pinn-bai → /client/:orgId/arguto)
        VITE_GOOGLE_MAPS_API_KEY: ${VITE_GOOGLE_MAPS_API_KEY:-}
    # Bind opcional (ex.: 127.0.0.1:18080 na VPS); Traefik usa a rede Docker.
    ports:
      - "${WEB_HOST_PORT:-127.0.0.1:8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - root_default
    labels:
      - traefik.enable=true
      # Traefik: Host() aceita um domínio; use || para vários hosts
      - traefik.http.routers.pinn-bai-app.rule=Host(`bai.pinnpb.com`) || Host(`bai.srv879715.hstgr.cloud`)
      - traefik.http.routers.pinn-bai-app.entrypoints=websecure
      - traefik.http.routers.pinn-bai-app.tls=true
      - traefik.http.routers.pinn-bai-app.tls.certresolver=mytlschallenge
      - traefik.http.services.pinn-bai-app.loadbalancer.server.port=80

networks:
  root_default:
    external: true
