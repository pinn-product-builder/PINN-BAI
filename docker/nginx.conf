server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Limites — uploads de leads em CSV (Sprint 3, EO-006) podem ser GG.
    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;

    # ── API Node Hono (Auditor de CRM, etc.) ─────────────────────────────────
    location /api/ {
        proxy_pass http://api:8787;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Backend Python (FastAPI) ─────────────────────────────────────────────
    # Cada prefixo é uma família de rotas declaradas em backend/main.py.
    # Mantemos o path original (sem stripar) porque o FastAPI espera
    # /email/inboxes, /crm/sync/..., etc.
    # Ordem importa: o /health do FastAPI fica em /py-health pra não
    # conflitar com o /health do api Node.
    location /crm/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;     # syncs Kommo demoram
    }

    location /hub/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ads/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /kpi/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /webhook/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /adapters/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Healthchecks
    location = /health {
        proxy_pass http://api:8787/health;
        proxy_set_header Host $host;
    }
    location = /py-health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    # Assets com hash no nome → cache longo e imutável (seguro, o hash muda a cada build).
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # index.html NUNCA em cache → o browser sempre pega a referência de chunk atual.
    # Evita "tela quebrada" após deploy quando o hash do bundle muda (cache stale).
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
